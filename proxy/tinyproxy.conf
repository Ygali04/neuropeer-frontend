## NeuroPeer residential proxy — runs on your Mac
## Exposed via ngrok so Railway worker can use your home IP

User nobody
Group nobody
Port 8888
Timeout 600
LogLevel Warning
MaxClients 50

# Allow all connections (ngrok handles the tunneling)
# Security: ngrok URL is random and not discoverable
Allow 0.0.0.0/0

# Required for HTTPS tunneling (YouTube uses HTTPS)
ConnectPort 443
ConnectPort 80
